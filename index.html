<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="images/favicon-64.png">
  <link rel="apple-touch-icon" href="images/favicon-180.png">
  <link rel="preload" href="fonts/exo2-black.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/exo2-light.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <header class="header">
    <a class="header__logo" href="#" aria-label="HoReCa Market - в начало">
      <img class="header__text" src="images/logo-text.png" alt="HoReCa Market">
    </a>
  </header>

  <nav class="nav" aria-label="Разделы">
    <a class="nav__logo" href="#" aria-label="В начало"><img src="images/logo-icon.png" alt=""></a>
    <div class="nav__links" id="nav-links"></div>
  </nav>

  <main id="main"></main>

  <footer class="footer">
    <img class="footer__logo" src="images/logo-text.png" alt="HoReCa Market">
    <p class="footer__note">Все изделия разработаны и изготовлены нашей студией собственноручно и фотографии являются настоящими, без использования ИИ</p>
    <div class="footer__links">
      <a class="contact" href="https://api.whatsapp.com/send/?phone=996776077501" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 8.2c.2-.5.5-.6.8-.6h.5l1 2.3-.7.9c.5 1.1 1.4 2 2.5 2.5l.9-.7 2.3 1v.5c0 .3-.1.6-.6.8-.6.4-1.6.5-2.9-.1a8.4 8.4 0 0 1-3.8-3.8c-.6-1.3-.5-2.3-.1-2.9z"/></svg>
        <span>Обсудить и оформить заказ можно у нас в <b>WhatsApp</b></span>
      </a>
      <a class="contact" href="https://www.instagram.com/horeca.market.kg/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="0.6"/></svg>
        <span>Подпишитесь на наш инстаграм, чтобы видеть все новинки <b>@horeca.market.kg</b></span>
      </a>
    </div>
  </footer>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer__track" id="viewer-track"></div>
    <button class="viewer__arrow viewer__arrow--prev" id="viewer-prev" aria-label="Предыдущее фото"></button>
    <button class="viewer__arrow viewer__arrow--next" id="viewer-next" aria-label="Следующее фото"></button>
    <div class="viewer__counter" id="viewer-counter"></div>
    <button class="viewer__close" id="viewer-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/photos.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
